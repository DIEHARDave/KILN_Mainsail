# KILN_Mainsail's Moonraker part (Kiln OS includes it while the plugin is
# on): updates from Mainsail or Fluidd (Software Updates).

# Mainsail itself (install.sh downloads the first copy)
[update_manager mainsail]
type: web
channel: stable
repo: mainsail-crew/mainsail
path: /data/ad5x/web/mainsail

# This plugin. After an update, run install.sh again as root if
# root/mainsail-hook.sh changed.
[update_manager kiln-mainsail]
type: git_repo
path: /data/ad5x/plugins/mainsail
origin: https://github.com/DIEHARDave/KILN_Mainsail.git
primary_branch: main
is_system_service: False
