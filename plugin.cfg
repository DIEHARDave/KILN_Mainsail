# KILN_Mainsail: Mainsail on port 80, Fluidd on port 81, WEB swaps them
# (README.md).
# Mainsail uses the same Klipper sections as Fluidd, which Kiln OS
# already has. The plugin's part is moonraker.conf (updates for Mainsail
# and this repository); install.sh (root, once) does the rest.

# Mainsail warns "gcode_macro pause/resume is not defined" when PAUSE and
# RESUME are Klipper's own [pause_resume] commands, as on Kiln OS. These
# pass straight through: pausing works exactly as before.
[gcode_macro PAUSE]
description: Pause the print (Klipper's PAUSE)
rename_existing: BASE_PAUSE
gcode:
  BASE_PAUSE {rawparams}

[gcode_macro RESUME]
description: Resume the print (Klipper's RESUME)
rename_existing: BASE_RESUME
gcode:
  BASE_RESUME {rawparams}

# WEB: swap the two UIs between ports 80 and 81 (zMod's macro name). It
# only saves web_port80; the root hook (install.sh) restarts nginx with
# the new order within about 3 s, and keeps it across reboots.
[gcode_macro WEB]
description: Swap Mainsail and Fluidd between ports 80 and 81
gcode:
  {% set now = printer.save_variables.variables.web_port80|default('mainsail') %}
  {% set new = 'mainsail' if now == 'fluidd' else 'fluidd' %}
  SAVE_VARIABLE VARIABLE=web_port80 VALUE="'{new}'"
  {% if new == 'fluidd' %}
    RESPOND MSG="WEB: Fluidd on port 80, Mainsail on port 81 within a few seconds"
  {% else %}
    RESPOND MSG="WEB: Mainsail on port 80, Fluidd on port 81 within a few seconds"
  {% endif %}
